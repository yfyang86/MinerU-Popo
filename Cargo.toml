[workspace]
resolver = "2"
members = [
    "crates/popo-core",
    "crates/popo-obs",
    "crates/popo-model",
    "crates/popo-readers",
    "crates/popo-table",
    "crates/popo-infer",
    "crates/popo-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/yfyang86/MinerU-Popo"

[workspace.dependencies]
# Internal crates
popo-core = { path = "crates/popo-core" }
popo-obs = { path = "crates/popo-obs" }
popo-model = { path = "crates/popo-model" }
popo-readers = { path = "crates/popo-readers" }
popo-infer = { path = "crates/popo-infer" }
popo-table = { path = "crates/popo-table" }

# Async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"

# HTTP / serialization
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# CLI / utils
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
regex = "1"
scraper = "0.20"
unicode-normalization = "0.1"
